name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and release
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish vitals.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/vitals.exe dist/vitals.exe
          cd dist
          sha256sum vitals.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          # Everything under "## [x.y.z]" up to the next "## [" heading.
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { p = 1; next }
            p && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            p { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/vitals.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/vitals.exe dist/SHA256SUMS.txt \
              --title "Vitals ${TAG#v}" --notes-file notes.md --verify-tag
          fi
